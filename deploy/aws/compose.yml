x-database-environment: &database-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
  DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DB_SCHEMA: ${POSTGRES_SCHEMA:-public}

x-api-environment: &api-environment
  <<: *database-environment
  NODE_ENV: ${NODE_ENV:-production}
  PORT: "3001"
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:?RATE_LIMIT_KEY_SECRET is required}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

x-api-image: &api-image
  image: semcomp-api:marco9
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile

x-application-security: &application-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=8m,mode=1777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  migrate:
    <<: [*api-image, *application-security]
    restart: "no"
    command:
      - npm
      - --workspace
      - api
      - exec
      - --
      - prisma
      - migrate
      - deploy
    environment:
      <<: *database-environment
      NODE_ENV: production
      NPM_CONFIG_CACHE: /tmp/.npm
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  seed:
    <<: [*api-image, *application-security]
    profiles:
      - operations
    restart: "no"
    command:
      - npm
      - --workspace
      - api
      - exec
      - --
      - prisma
      - db
      - seed
    environment:
      <<: *database-environment
      NODE_ENV: production
      NPM_CONFIG_CACHE: /tmp/.npm
      SEED_MODE: ${SEED_MODE:-admin-only}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:?SEED_ADMIN_NAME is required}
      SEED_ADMIN_CPF: ${SEED_ADMIN_CPF:?SEED_ADMIN_CPF is required}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  api:
    <<: [*api-image, *application-security]
    restart: unless-stopped
    command:
      - node
      - apps/api/dist/src/main.js
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/health',
          {signal: AbortSignal.timeout(3000)})
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - backend
      - edge

  web:
    image: semcomp-web:marco9
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      AUTH_PROXY_ENABLED: ${AUTH_PROXY_ENABLED:-true}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/login',
          {signal: AbortSignal.timeout(3000)})
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - edge

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,mode=0755
      - /var/run:rw,noexec,nosuid,size=1m,mode=0755
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/nginx-health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - edge

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  edge:
