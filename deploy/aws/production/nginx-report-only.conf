events {
    worker_connections 1024;
}

http {
    client_max_body_size 128k;
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=50r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name gameficacao.semcomp.com.br _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /.well-known/acme-challenge/ {
            default_type text/plain;
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name gameficacao.semcomp.com.br;

        ssl_certificate /etc/letsencrypt/live/gameficacao.semcomp.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gameficacao.semcomp.com.br/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            limit_req zone=api_rate burst=100;
            proxy_pass http://api:3001/;
        }

        location / {
            proxy_pass http://web:3000;
        }
    }
}
