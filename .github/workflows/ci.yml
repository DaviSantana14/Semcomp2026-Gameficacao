name: CI

on:
  push:
  pull_request:

jobs:
  deployment-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Activate pinned npm version
        run: |
          corepack enable
          corepack prepare npm@11.9.0 --activate

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace api run prisma:generate
        env:
          DB_HOST: build-db
          DB_PORT: 5432
          DB_NAME: semcomp
          DB_USER: semcomp
          DB_PASSWORD: semcomp
          DB_SCHEMA: public

      - name: Test deployment artifact contracts
        run: >-
          node --test
          deploy/aws/cloudformation.test.mjs
          deploy/aws/scripts/capture-metrics.test.mjs
          scripts/load/cpf.test.mjs
          scripts/load/marco-11-load.test.mjs
          scripts/load/marco-12-load.test.mjs

      - name: Test Marco 12 persistence and artifact contracts
        run: >-
          npm --workspace api test -- --runTestsByPath
          src/common/specs/marco12-schema-migration.spec.ts
          src/common/specs/download-gate.spec.ts
          src/claim-codes/specs/claim-code-qr.spec.ts
          src/claim-codes/specs/claim-code-artifacts.service.spec.ts

      - name: Test deployment scripts
        run: npm run test:deployment-scripts

      - name: Test production deployment contracts
        run: npm run test:production-deployment

      - name: Test authentication and rate-limit contracts
        run: >-
          npm --workspace api test -- --runTestsByPath
          src/auth/specs/password-policy.spec.ts
          src/auth/specs/admin-password.service.spec.ts
          src/auth/specs/auth.service.spec.ts
          src/security/rate-limit-key.spec.ts
          src/security/app-throttler.guard.spec.ts

      - name: Validate deployment script syntax
        run: bash -n deploy/aws/scripts/*.sh

      - name: Validate production deployment script syntax
        run: bash -n deploy/aws/production/scripts/*.sh

      - name: Validate rehearsal Compose configuration
        run: >-
          docker compose
          --env-file deploy/aws/rehearsal.env.example
          -f deploy/aws/compose.yml
          config --quiet

      - name: Validate production Compose configuration
        run: >-
          docker compose
          --env-file deploy/aws/production/production.env.example
          -f deploy/aws/production/compose.yml
          config --quiet

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t semcomp-api:${{ github.sha }} .

      - name: Verify bcrypt in the final API image
        run: >-
          docker run --rm --entrypoint node semcomp-api:${{ github.sha }}
          -e "require('bcrypt')"

      - name: Build web image
        run: >-
          docker build -f apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=/api
          -t semcomp-web:${{ github.sha }} .

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: semcomp_e2e
          POSTGRES_USER: semcomp_ci
          POSTGRES_PASSWORD: semcomp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semcomp_ci -d semcomp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: semcomp_e2e
      DB_USER: semcomp_ci
      DB_PASSWORD: semcomp_ci
      DB_SCHEMA: public
      JWT_SECRET: semcomp-ci-not-a-real-secret
      RATE_LIMIT_KEY_SECRET: semcomp-ci-not-a-real-rate-limit-secret
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Activate pinned npm version
        run: |
          corepack enable
          corepack prepare npm@11.9.0 --activate

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace api run prisma:generate

      - name: Apply database migrations
        run: npm --workspace api exec prisma migrate deploy

      - name: Lint API
        run: npm --workspace api run lint:check

      - name: Lint web app
        run: npm --workspace web run lint

      - name: Test web app
        run: npm --workspace web test

      - name: Test API
        run: npm --workspace api test

      - name: Test API end-to-end
        run: npm --workspace api run test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://semcomp_ci:semcomp_ci@localhost:5432/semcomp_e2e?schema=public

      - name: Build API
        run: npm --workspace api run build

      - name: Build web app
        run: npm --workspace web run build

  deploy-production:
    needs: [deployment-artifacts, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://gameficacao.semcomp.com.br
    concurrency:
      group: semcomp-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: semcomp-production-${{ github.run_id }}
          aws-region: sa-east-1

      - name: Publish immutable production release
        shell: pwsh
        run: >-
          ./deploy/aws/production/scripts/publish.ps1
          -ExpectedAccountId '${{ vars.AWS_ACCOUNT_ID }}'
          -Region sa-east-1
          -StackName semcomp-production
          -RepositoryPath .
