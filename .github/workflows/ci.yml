name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: semcomp_ci
          POSTGRES_USER: semcomp_ci
          POSTGRES_PASSWORD: semcomp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semcomp_ci -d semcomp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: semcomp_ci
      DB_USER: semcomp_ci
      DB_PASSWORD: semcomp_ci
      DB_SCHEMA: public
      JWT_SECRET: semcomp-ci-not-a-real-secret
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Activate pinned npm version
        run: |
          corepack enable
          corepack prepare npm@11.9.0 --activate

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace api run prisma:generate

      - name: Apply database migrations
        run: npm --workspace api exec prisma migrate deploy

      - name: Lint API
        run: npm --workspace api run lint:check

      - name: Lint web app
        run: npm --workspace web run lint

      - name: Test web app
        run: npm --workspace web test

      - name: Test API
        run: npm --workspace api test

      - name: Test API end-to-end
        run: npm --workspace api run test:e2e

      - name: Build API
        run: npm --workspace api run build

      - name: Build web app
        run: npm --workspace web run build
